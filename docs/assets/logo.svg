<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="fiilpod logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4B8BF5"/>
      <stop offset="52%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#FF6900"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle inner highlight -->
  <rect x="26" y="26" width="460" height="460" rx="94" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>

  <!-- headphone band -->
  <path d="M126 306 V236 C126 164 184 106 256 106 C328 106 386 164 386 236 V306"
        fill="none" stroke="url(#cup)" stroke-width="34" stroke-linecap="round"/>

  <!-- left ear cup -->
  <rect x="88" y="286" width="96" height="150" rx="46" fill="url(#cup)"/>
  <rect x="112" y="316" width="48" height="90" rx="24" fill="#4B8BF5" fill-opacity="0.28"/>

  <!-- right ear cup -->
  <rect x="328" y="286" width="96" height="150" rx="46" fill="url(#cup)"/>
  <rect x="352" y="316" width="48" height="90" rx="24" fill="#FF6900" fill-opacity="0.30"/>

  <!-- signal waves -->
  <g filter="url(#soft)" stroke="#FFFFFF" stroke-opacity="0.9" fill="none" stroke-linecap="round">
    <path d="M416 196 C446 224 446 276 416 304" stroke-width="9" stroke-opacity="0.55"/>
    <path d="M446 168 C492 210 492 290 446 332" stroke-width="9" stroke-opacity="0.28"/>
  </g>
</svg>
